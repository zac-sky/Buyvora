name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buyvora-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.12'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-local-path: ${{ github.workspace }}/.uv-cache
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run automated tests
        run: uv run --locked pytest -q
      - name: Verify two-turn HTTP agent flow
        run: uv run --locked python scripts/smoke_agent.py
      - name: Check retrieval quality and commerce constraints
        run: uv run --locked python scripts/eval_retrieval.py --check
