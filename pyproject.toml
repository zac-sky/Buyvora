[project]
name = "buyvora-agent"
version = "0.2.0"
description = "Buyvora 电商 Agent：面向真实购物场景的智能购物助手"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

